# Golden retrieval cases for the Houdini documentation knowledge graph.
#
# Each case carries ONLY request metadata, an expected outcome and expected
# entity IDs/symbols -- never official document bodies, signatures prose or raw
# page text. Expected IDs were grounded against a real 21.0.440 build.
# expect: match | ambiguous | no_match | invalid
#   match     -> ok response whose results contain one of expected_any
#   ambiguous -> AMBIGUOUS_SYMBOL with >=2 candidates
#   no_match  -> a valid request with no result (NO_MATCH)
#   invalid   -> INVALID_ARGUMENT (e.g. empty request or bad direction)

# --- exact SOP node --------------------------------------------------------
- id: sop_boolean
  category: sop_exact
  request: {symbol: boolean}
  expect: match
  expected_any: ['node_document:sop/boolean.txt@current']

