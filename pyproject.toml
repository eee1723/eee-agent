[project]
name = "eee-agent"
version = "0.1.0"
description = "deepagents-based procedural modeling agent for SideFX Houdini 21"
requires-python = ">=3.11,<3.12"
dependencies = [
    "deepagents==0.6.12",
    "langchain==1.3.13",
    "langchain-core==1.4.9",
    "langchain-openai==1.3.5",
    "langchain-anthropic==1.4.8",
    "langgraph==1.2.9",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.2",
    # Persistent Runtime: async app/checkpoint SQLite, WebSocket transport.
    "aiosqlite==0.22.1",
    "langgraph-checkpoint-sqlite==3.1.0",
    "websockets==15.0.1",
]

[project.optional-dependencies]
eval = ["pytest==8.4.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eee_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "houdini_kb: opt-in tests that require a local Houdini Knowledge cache/build",
]
