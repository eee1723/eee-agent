[project]
name = "eee-agent"
version = "0.1.0"
description = "deepagents-based procedural modeling agent for SideFX Houdini 21"
requires-python = ">=3.11,<3.12"
dependencies = [
    "deepagents==0.6.12",
    "langchain==1.3.13",
    "langchain-core==1.4.9",
    "langchain-openai==1.3.5",
    "langchain-anthropic==1.4.8",
    "langgraph==1.2.9",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.2",
    # Persistent Runtime: async app/checkpoint SQLite, WebSocket transport.
    "aiosqlite==0.22.1",
    "langgraph-checkpoint-sqlite==3.1.0",
    "websockets==15.0.1",
]

[project.optional-dependencies]
eval = ["pytest>=9.0.3,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eee_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# A background thread that reports into a closed event loop (e.g. an aiosqlite
# worker orphaned by a test that did not close its database) is a real resource
# leak. Promote only this category to a hard failure so leaks are attributed to
# the test that owns the resource, rather than surfacing as a warning in a
# later test. Third-party deprecation warnings are intentionally left as-is.
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]
markers = [
    "houdini_kb: opt-in tests that require a local Houdini Knowledge cache/build",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Runtime is the security boundary: F catches unused/undefined imports and
# TID251 makes accidental legacy bridge imports a CI failure. E4 catches
# syntax/indentation errors without imposing a repository-wide formatter
# migration on the legacy modules.
select = ["E4", "F", "TID"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"eee_agent.bridge" = { msg = "Runtime must use the typed Houdini bridge; legacy eee_agent.bridge is removed" }

[dependency-groups]
dev = [
    "mypy==1.15.0",
    "pip-audit==2.9.0",
    "ruff==0.11.13",
]
